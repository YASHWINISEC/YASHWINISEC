name: Update Burgundy Profile

on:
  push:
    branches:
      - main
    paths:
      - "profile.json"
      - "scripts/generate_profile.py"
  schedule:
    # Refreshes live GitHub contribution graph daily at 00:30 UTC (06:00 AM IST)
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Burgundy SVGs & README from profile.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_profile.py

      - name: Commit and push updated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update burgundy profile [skip ci]"
            git push
          fi
