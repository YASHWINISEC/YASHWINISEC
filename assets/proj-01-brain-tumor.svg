<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 248" width="1200" height="248" role="img" aria-label="Brain Tumor Detection — Hybrid Autoencoders + Vision Transformers (ViT)">
  <defs>
    <linearGradient id="ym-p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12070D" />
      <stop offset="55%" stop-color="#1D0913" />
      <stop offset="100%" stop-color="#4E122B" />
    </linearGradient>
    <linearGradient id="ym-p1-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#701A3D" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="ym-p1-sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0" />
      <stop offset="50%" stop-color="#E5B5C7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0" />
    </linearGradient>
    <clipPath id="ym-p1-clip"><rect x="1" y="1" width="1198" height="246" rx="14" /></clipPath>
  </defs>

  <g clip-path="url(#ym-p1-clip)">
    <rect width="1200" height="248" fill="url(#ym-p1-bg)" />
    <line x1="20" y1="2" x2="1180" y2="2" stroke="url(#ym-p1-sweep)" stroke-width="2" stroke-dasharray="180 980" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="1160" to="0" dur="8s" repeatCount="indefinite" />
    </line>

    <g transform="translate(42, 40)">
      <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" fill="#C77B9B" letter-spacing="1.8">01 · DEEP LEARNING · MEDICAL IMAGING</text>
      <text x="0" y="42" font-family="Georgia, 'Times New Roman', 'DejaVu Serif', serif" font-size="31" font-weight="700" fill="#F8F0F3">Brain Tumor Detection</text>
      <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E5B5C7">Hybrid Autoencoders + Vision Transformers (ViT)</text>
      <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#F8F0F3" fill-opacity="0.88">Engineered a hybrid deep learning pipeline for automated MRI brain tumor detection,</text>
      <text x="0" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#F8F0F3" fill-opacity="0.88">combining representation learning with data augmentation and hyperparameter tuning.</text>
      <g transform="translate(0, 154)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10.5"><rect x="0" y="0" width="70" height="24" rx="6" fill="#16080F" stroke="#701A3D" stroke-width="1" /><text x="35.0" y="15.5" text-anchor="middle" fill="#E5B5C7">Python</text><rect x="78" y="0" width="78" height="24" rx="6" fill="#16080F" stroke="#701A3D" stroke-width="1" /><text x="117.0" y="15.5" text-anchor="middle" fill="#E5B5C7">PyTorch</text><rect x="164" y="0" width="102" height="24" rx="6" fill="#16080F" stroke="#701A3D" stroke-width="1" /><text x="215.0" y="15.5" text-anchor="middle" fill="#E5B5C7">TensorFlow</text><rect x="274" y="0" width="174" height="24" rx="6" fill="#16080F" stroke="#701A3D" stroke-width="1" /><text x="361.0" y="15.5" text-anchor="middle" fill="#E5B5C7">Vision Transformers</text><rect x="456" y="0" width="118" height="24" rx="6" fill="#16080F" stroke="#701A3D" stroke-width="1" /><text x="515.0" y="15.5" text-anchor="middle" fill="#E5B5C7">Autoencoders</text></g>
    </g>

    <g transform="translate(838, 16)">
      <text x="0" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#C77B9B" letter-spacing="1.5">ARCHITECTURE FLOW</text>
      <rect x="0" y="28" width="316" height="42" rx="8" fill="#14070D" fill-opacity="0.88" stroke="#701A3D" stroke-width="1" /><circle cx="16" cy="49" r="3.5" fill="#E5B5C7" /><text x="30" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" fill="#F8F0F3">01 · MRI PREPROCESSING</text><text x="30" y="61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#C77B9B">Image normalization &amp; augmentation</text><line x1="158" y1="70" x2="158" y2="82" stroke="#C77B9B" stroke-width="1.2" stroke-opacity="0.7" /><rect x="0" y="82" width="316" height="42" rx="8" fill="#14070D" fill-opacity="0.88" stroke="#701A3D" stroke-width="1" /><circle cx="16" cy="103" r="3.5" fill="#E5B5C7" /><text x="30" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" fill="#F8F0F3">02 · HYBRID ENCODER</text><text x="30" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#C77B9B">Autoencoder features + ViT attention</text><line x1="158" y1="124" x2="158" y2="136" stroke="#C77B9B" stroke-width="1.2" stroke-opacity="0.7" /><rect x="0" y="136" width="316" height="42" rx="8" fill="#14070D" fill-opacity="0.88" stroke="#701A3D" stroke-width="1" /><circle cx="16" cy="157" r="3.5" fill="#E5B5C7" /><text x="30" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" fill="#F8F0F3">03 · DIAGNOSTIC HEAD</text><text x="30" y="169" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#C77B9B">Tuned tumor classification output</text>
    </g>

    <rect x="1" y="1" width="1198" height="246" rx="14" fill="none" stroke="url(#ym-p1-border)" stroke-width="1.3" />
  </g>
</svg>
