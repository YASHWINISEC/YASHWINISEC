<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 248" width="1200" height="248" role="img" aria-label="BLIP Captioning &amp; PDF Q&amp;A — Vision-Language Modeling &amp; Document Intelligence">
