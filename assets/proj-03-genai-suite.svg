      <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#F8F0F3" fill-opacity="0.88">Built two applied GenAI systems: natural-language image captioning powered by BLIP</text>
      <text x="0" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#F8F0F3" fill-opacity="0.88">and an interactive PDF Question-Answering chatbot for conversational document retrieval.</text>
