      <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#F8F0F3" fill-opacity="0.88">Architected a full-stack MERN Logistics app with JWT auth &amp; role-based tracking,</text>
