<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Yashwini M. — AI/ML Engineer</title>
  <desc id="hero-desc">A burgundy and rose developer banner with subtle animated gradients, technical grid, orbital details, and the message building intelligent solutions.</desc>
  <defs>
    <linearGradient id="hero-bg-yw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset=".52" stop-color="#451126"/>
      <stop offset="1" stop-color="#190B12"/>
      <animate attributeName="x2" values="1;0;1" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="hero-line-yw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset=".5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#C77B9B"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="hero-glow-yw">
      <stop offset="0" stop-color="#C77B9B" stop-opacity=".22"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-grid-yw" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#E5B5C7" stroke-opacity=".075" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#E5B5C7" fill-opacity=".18"/>
    </pattern>
    <filter id="hero-soft-yw" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <mask id="hero-fade-yw">
      <linearGradient id="hero-mask-gradient-yw" x1="0" x2="1">
        <stop offset="0" stop-color="white" stop-opacity=".15"/>
        <stop offset=".5" stop-color="white"/>
        <stop offset="1" stop-color="white" stop-opacity=".15"/>
      </linearGradient>
      <rect width="1200" height="390" fill="url(#hero-mask-gradient-yw)"/>
    </mask>
  </defs>

  <rect width="1200" height="390" rx="22" fill="url(#hero-bg-yw)"/>
  <rect width="1200" height="390" rx="22" fill="url(#hero-grid-yw)"/>
  <circle cx="1000" cy="95" r="250" fill="url(#hero-glow-yw)"/>
  <circle cx="180" cy="370" r="220" fill="url(#hero-glow-yw)"/>

  <g fill="none" stroke="#C77B9B" stroke-opacity=".34" mask="url(#hero-fade-yw)">
    <ellipse cx="980" cy="190" rx="235" ry="82" transform="rotate(-28 980 190)" stroke-width="1.2"/>
    <ellipse cx="980" cy="190" rx="235" ry="82" transform="rotate(42 980 190)" stroke-width="1.2"/>
    <ellipse cx="980" cy="190" rx="150" ry="54" transform="rotate(90 980 190)" stroke-width="1"/>
  </g>
  <circle cx="1170" cy="74" r="4" fill="#E5B5C7">
    <animate attributeName="opacity" values=".25;1;.25" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="806" cy="305" r="3" fill="#C77B9B">
    <animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <path d="M62 58H1138V332H62Z" fill="none" stroke="url(#hero-line-yw)" stroke-opacity=".45"/>
  <path d="M88 282 C230 282 250 282 330 282 S480 282 570 282" fill="none" stroke="#C77B9B" stroke-opacity=".12" stroke-width="1"/>
  <path d="M90 286 C250 286 350 286 500 286" fill="none" stroke="#E5B5C7" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0 420;420 0;0 420" dur="7s" repeatCount="indefinite"/>
  </path>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="105" fill="#E5B5C7" font-size="15" letter-spacing="6">HELLO, I'M</text>
    <text x="600" y="184" fill="#F8F0F3" font-size="66" font-weight="700" letter-spacing="2">YASHWINI M.</text>
    <text x="600" y="229" fill="#E5B5C7" font-size="20" letter-spacing="1.6">AI/ML ENGINEER  ·  DATA SCIENCE  ·  FULL-STACK</text>
    <text x="600" y="316" fill="#C77B9B" font-size="13" letter-spacing="3">BUILDING IDEAS INTO INTELLIGENT SOLUTIONS</text>
  </g>
</svg>
