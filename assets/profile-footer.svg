<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-labelledby="ym-footer-title ym-footer-desc">
  <title id="ym-footer-title">Yashwini M. — Profile Footer</title>
  <desc id="ym-footer-desc">Minimal burgundy SVG footer with animated pulse line and editorial sign-off for Yashwini M.</desc>
  <defs>
    <linearGradient id="ym-footer-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="50%" stop-color="#190B12" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>
    <linearGradient id="ym-footer-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#C77B9B" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#E5B5C7" stop-opacity="1" />
      <stop offset="70%" stop-color="#C77B9B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0.1" />
    </linearGradient>
    <filter id="ym-footer-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="110" rx="14" fill="url(#ym-footer-bg)" stroke="#451126" stroke-width="1.2" />

  <!-- Top Horizon Rule -->
  <line x1="60" y1="30" x2="1140" y2="30" stroke="#451126" stroke-width="1" />
  <line x1="60" y1="30" x2="1140" y2="30" stroke="url(#ym-footer-line)" stroke-width="1.8" stroke-dasharray="180 900" stroke-dashoffset="0" filter="url(#ym-footer-glow)">
    <animate attributeName="stroke-dashoffset" from="1080" to="0" dur="6.5s" repeatCount="indefinite" />
  </line>

  <!-- Center Monogram Node -->
  <g transform="translate(600, 30)">
    <rect x="-18" y="-10" width="36" height="20" rx="10" fill="#190B12" stroke="#701A3D" stroke-width="1.2" />
    <circle cx="0" cy="0" r="3.5" fill="#E5B5C7">
      <animate attributeName="r" values="3;4.5;3" dur="3.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Editorial Sign-Off -->
  <text x="600" y="66" text-anchor="middle" font-family="'DejaVu Serif', Georgia, serif" font-size="16" font-weight="700" fill="#F8F0F3" letter-spacing="0.8">
    Yashwini M.
  </text>
  <text x="600" y="88" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', ui-monospace, monospace" font-size="11" fill="#C77B9B" letter-spacing="1.5">
    AI/ML ENGINEERING  •  DATA SCIENCE  •  FULL-STACK SYSTEMS
  </text>
</svg>
