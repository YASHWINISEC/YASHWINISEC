<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-labelledby="footer-title">
  <title id="footer-title">Always curious, always learning, always building</title>
  <defs>
    <linearGradient id="footer-rule-yw" x1="0" x2="1">
      <stop offset="0" stop-color="#451126" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#451126" stop-opacity="0"/>
      <animate attributeName="x1" values="0;1;0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <path d="M60 20H1140" stroke="url(#footer-rule-yw)" stroke-width="1.5"/>
  <circle cx="600" cy="20" r="3" fill="#C77B9B">
    <animate attributeName="r" values="2;4;2" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="63" text-anchor="middle" fill="#C77B9B" font-family="Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="3">ALWAYS CURIOUS  ·  ALWAYS LEARNING  ·  ALWAYS BUILDING</text>
</svg>
